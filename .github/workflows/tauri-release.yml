name: Tauri Release (test, Win/Mac/Linux)

# Builds the experimental Tauri runtime on Windows, macOS and Linux and
# publishes the bundles as a GitHub prerelease. Trigger by pushing a tag
# like `tauri-v3.3.0-test.2`, or run manually with workflow_dispatch and
# provide the tag to create.
#
# A first job creates (or reuses) the prerelease so the three platform
# jobs can upload their assets to it in parallel without racing.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. tauri-v3.3.0-test.2)'
        required: true
        default: 'tauri-v3.3.0-test.2'
  push:
    tags:
      - 'tauri-v*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - name: Create or reuse prerelease
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ inputs.tag }}' || context.ref.replace('refs/tags/', '');
            const body = [
              'Experimental Tauri 2 build of Video Hub App 3 for Windows, macOS and Linux testing.',
              'Unsigned test build: Windows SmartScreen and macOS Gatekeeper may warn on first run',
              '(on macOS, run `xattr -cr` on the app if it is reported as damaged).',
              'ffmpeg/ffprobe must be on PATH (or configured in the app) for thumbnails.',
              'See TAURI_MIGRATION.md in the repository for the migration status and checklist.',
            ].join('\n');
            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner, repo: context.repo.repo, tag });
              core.info(`Reusing existing release ${existing.data.id} for ${tag}`);
              return existing.data.id;
            } catch (e) {
              const rel = await github.rest.repos.createRelease({
                owner: context.repo.owner, repo: context.repo.repo,
                tag_name: tag,
                name: `Video Hub App 3 - Tauri test ${tag}`,
                body, draft: false, prerelease: true });
              core.info(`Created release ${rel.data.id} for ${tag}`);
              return rel.data.id;
            }

  publish:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--bundles nsis,msi'
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            rust_targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: '--bundles deb,rpm,appimage'
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf rpm libfuse2 \
            build-essential file

      - name: Install JS dependencies
        run: npm install --legacy-peer-deps

      - name: Build Tauri app and upload to prerelease
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
